name: quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [services/gateway-go, services/platform-go]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - run: cd ${{ matrix.module }} && go test ./... && go vet ./...
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: cd services/insight-py && uv sync --all-extras && uv run pytest && uv run ruff check . && uv run mypy insight
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint && npm run test && npm run build
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: 1.50.0
      - run: buf lint contracts
      - run: buf breaking contracts --against '.git#branch=main,subdir=contracts'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python tools/check_contracts.py
