services:
  postgres-platform:
    image: postgres:16.4
    environment:
      POSTGRES_DB: gm_platform
      POSTGRES_USER: gm_platform
      POSTGRES_PASSWORD: ${GM_PLATFORM_DB_PASSWORD:?Set a local development password}
    volumes:
      - platform_data:/var/lib/postgresql/data
      - ./migrations/platform/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql:ro
    ports:
      - "127.0.0.1:55432:5432"
  postgres-registry:
    image: postgres:16.4
    environment:
      POSTGRES_DB: gm_registry
      POSTGRES_USER: gm_registry
      POSTGRES_PASSWORD: ${GM_REGISTRY_DB_PASSWORD:?Set a local development password}
    ports:
      - "127.0.0.1:55433:5432"
  broker:
    image: eclipse-mosquitto:2.0
    volumes:
      - ./broker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "127.0.0.1:51883:1883"
  gateway:
    build: ../services/gateway-go
    environment:
      GM_GATEWAY_MODE: development
      GM_HTTP_ADDR: :8081
    ports:
      - "127.0.0.1:58081:8081"
  platform:
    build: ../services/platform-go
    environment:
      GM_PLATFORM_MODE: development
      GM_HTTP_ADDR: :8082
      SUPABASE_URL: ${SUPABASE_URL:?Set SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?Set SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      GM_PUBLIC_URL: ${GM_PUBLIC_URL:-http://localhost:5173}
    depends_on: [postgres-platform]
    ports:
      - "127.0.0.1:58082:8082"
  insight:
    build: ../services/insight-py
    ports:
      - "127.0.0.1:58083:8000"
volumes:
  platform_data:
